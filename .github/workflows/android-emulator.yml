name: Android emulator screenshots

on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/android-emulator.yml"]

jobs:
  screenshots:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app on emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash android/scripts/emulator-screenshots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: salaam-compass-screenshots
          path: screenshots/
      # Publishes the screenshots on a separate branch so they can be viewed or fetched with plain git.
      - name: Push screenshots to the emulator-screenshots branch
        if: always()
        run: |
          cd screenshots
          git init -q -b emulator-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Emulator screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:emulator-screenshots
